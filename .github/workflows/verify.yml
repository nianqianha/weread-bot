name: Verify Wiring

# Runs the invariant checks on every push. This is the regression guard for
# semantic flips in the workflow wiring -- the class of bug where one side of a
# contract changes and the other silently keeps its old meaning.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0"

        - name: Assert the Actions wiring invariants
          env:
            TARGET_MINUTES: '90'
          run: python .github/scripts/verify_config.py

        # A check that has never been shown to fail is not a check. This injects
        # one real defect per case and asserts the verifier objects; four of
        # these cases exist because an assertion was written loosely enough to
        # pass a broken state. Runs on a staged copy, never the checkout.
        - name: Prove the invariants can actually fail
          env:
            TARGET_MINUTES: '90'
          run: python .github/scripts/test_verifier.py