name: Auto Reading Bot  on:   # Three slots a day, but only the first one that is actually due reads:   # the "Decide whether this slot should read" step skips the rest until 20   # hours have passed since the last successful scheduled run.   #   # The odd minutes are deliberate. Observed GitHub scheduler delay over   # 09-28..10-01 was 6h14m on the morning slot and 5h20m on the evening one,   # so ~5h47m on average. The cron values are the desired fire time minus that   # average, which should put the runs at roughly 10:00 / 16:00 / 22:00 Beijing.   # Re-measure from the weekly digest email ("average delay") and nudge these   # if it drifts. GitHub cron is always UTC.   schedule:     - cron: '13 2 * * *'   # UTC 02:13 -> ~10:00 Beijing     - cron: '13 8 * * *'   # UTC 08:13 -> ~16:00 Beijing     - cron: '13 20 * * *'  # UTC 20:13 -> ~22:00 Beijing       # 鎵嬪姩瑙﹀彂   workflow_dispatch:     inputs:       target_duration:         description: '闃呰鏃堕暱锛堝垎閽燂紝鏍煎紡锛?0-20銆傜暀绌烘椂浼樺厛浣跨敤浠撳簱 Secret TARGET_DURATION锛屽惁鍒欓粯璁?1-2锛?         required: false         default: ''         type: string       reading_mode:         description: '闃呰妯″紡'         required: false         default: 'smart_random'         type: choice         options:         - smart_random         - sequential         - pure_random       notify_enabled:         description: '鍚敤閫氱煡'         required: false         default: true         type: boolean       notify_only_on_failure:         description: '浠呭け璐ユ椂鍙戦€侀€氱煡'         required: false         default: false         type: boolean       history_enabled:         description: '鍚敤鎵ц鍘嗗彶鎸佷箙鍖?         required: false         default: true         type: boolean       history_max_entries:         description: '鎵ц鍘嗗彶鏈€澶氫繚鐣欏灏戞潯'         required: false         default: '50'         type: string  jobs:   auto-reading:     runs-on: ubuntu-latest     timeout-minutes: 150  # 2灏忔椂瓒呮椂          steps:     - name: Checkout code       uses: actions/checkout@v4      - name: Set up Python 3.11       uses: actions/setup-python@v5       with:         python-version: '3.11'      - name: Install dependencies       run: |         python -m pip install --upgrade pip         pip install -r requirements.txt      - name: Resolve runtime parameters       env:         INPUT_TARGET_DURATION: ${{ github.event.inputs.target_duration }}         SECRET_TARGET_DURATION: ${{ secrets.TARGET_DURATION }}       run: |         target_duration="${INPUT_TARGET_DURATION}"          if [ -z "$target_duration" ]; then           target_duration="${SECRET_TARGET_DURATION}"         fi          if [ -z "$target_duration" ]; then           target_duration="1-2"         fi          echo "TARGET_DURATION=$target_duration" >> "$GITHUB_ENV"      - name: Create config file       run: |         cat > config.yaml <<EOF         app:           name: "WeReadBot-GitHub-Action"           startup_mode: "immediate"           startup_delay: "30-90"          reading:           mode: "${{ github.event.inputs.reading_mode || 'smart_random' }}"           # 鐩爣闃呰鏃堕暱锛堝垎閽燂級锛屾敮鎸佸尯闂撮殢鏈猴紝鏍煎紡濡傦細"1" 鎴?"1-2"           target_duration: "${TARGET_DURATION}"           reading_interval: "30-48"           use_curl_data_first: true           fallback_to_config: true           smart_random:             book_continuity: 0.8             chapter_continuity: 0.7             book_switch_cooldown: 3600          human_simulation:           enabled: true           reading_speed_variation: true           break_probability: 0.15           break_duration: "10-20"           rotate_user_agent: false          network:           timeout: 30           retry_times: 3           retry_delay: "5-15"           rate_limit: 10          notification:           enabled: ${{ github.event.inputs.notify_enabled != 'false' }}           include_statistics: true           only_on_failure: ${{ github.event.inputs.notify_only_on_failure == 'true' }}           triggers:             session_success: ${{ github.event.inputs.notify_only_on_failure != 'true' }}             multi_user_summary: ${{ github.event.inputs.notify_only_on_failure != 'true' }}             session_failure: true             runtime_error: true             general: true          logging:           level: "INFO"           format: "detailed"           file: "logs/weread.log"           max_size: "10MB"           backup_count: 5           console: true          history:           enabled: ${{ github.event.inputs.history_enabled != 'false' }}           file: "logs/run-history.json"           max_entries: ${{ github.event.inputs.history_max_entries || '50' }}           persist_runtime_error: true         EOF      - name: Create logs directory       run: mkdir -p logs      - name: Decide whether this slot should read       id: guard       env:         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}         REPO: ${{ github.repository }}         WORKFLOW: 'auto-reading.yml'         EVENT_NAME: ${{ github.event_name }}         MIN_HOURS: '20'       run: |         # The goal is one session of credited reading per day, so a scheduled         # slot runs only when the last session that ACTUALLY banked reading time         # is at least MIN_HOURS old.         #         # "Actually banked" is read from the run-history.json artifact, not from         # the run's conclusion. Both cheaper proxies are provably wrong:         #   - conclusion == success: four runs reported success while the bot step         #     was skipped by an inverted gate, so this signal lies exactly when         #     things are broken;         #   - "the run uploaded an artifact": the upload is `if: always()`, so a         #     run that died during startup still uploads a log with no history in         #     it.         # .github/scripts/last_credit.py walks back through recent scheduled runs         # and prints the created_at of the newest one with credited seconds.         # The watchdog uses the same helper so the two can never disagree.         if [ "$EVENT_NAME" != "schedule" ]; then           echo "should_run=true" >> "$GITHUB_OUTPUT"           echo "manual dispatch ($EVENT_NAME): always runs, not counted against the daily budget"           exit 0         fi         last=$(python .github/scripts/last_credit.py 2>/dev/null) || last=""         if [ -z "$last" ]; then           echo "should_run=true" >> "$GITHUB_OUTPUT"           echo "no credited scheduled session on record, running this slot"           exit 0         fi         now=$(date -u +%s)         then_s=$(date -u -d "$last" +%s) || then_s=""         if [ -z "$then_s" ]; then           echo "could not parse '$last' as a timestamp, failing open and running"           echo "should_run=true" >> "$GITHUB_OUTPUT"           exit 0         fi         hours=$(( (now - then_s) / 3600 ))         echo "last credited session: $last (${hours}h ago)"         # outputs.should_run==true means GO; the gate must compare against it with ==.         if [ "$hours" -ge "$MIN_HOURS" ]; then           echo "should_run=true" >> "$GITHUB_OUTPUT"           echo "${hours}h >= ${MIN_HOURS}h, running this slot"         else           echo "should_run=false" >> "$GITHUB_OUTPUT"           echo "${hours}h < ${MIN_HOURS}h, skipping: today's reading is already accounted for"         fi     - name: Run WeRead Bot       if: "${{ github.event_name != 'schedule' || steps.guard.outputs.should_run == 'true' }}"       env:         # Cookie鍒锋柊QL灞炴€э紝鏍规嵁涓嶅悓鐢ㄦ埛鐨勭幆澧冿紝鍙兘闇€瑕佽缃负True鎴朏alse鏉ョ‘淇漜ookie鍒锋柊姝ｅ父宸ヤ綔锛岄粯璁ゅ€间负false         HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}         # 澶氱敤鎴?cURL锛氬湪 WEREAD_CURL_STRING 涓斁缃娈?curl锛屾涓庢涔嬮棿鑷冲皯鎻掑叆涓や釜绌鸿         WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}         # 澶氱敤鎴峰苟鍙戞帶鍒讹紝鏈缃粯璁?1锛堥『搴忔墽琛岋級         MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}         # 鍗曠敤鎴疯繛缁槄璇诲け璐ヤ笂闄愶紝鏈缃椂榛樿 5         MAX_CONSECUTIVE_FAILURES: ${{ secrets.MAX_CONSECUTIVE_FAILURES || 5 }}         # 閫氱煡鐩稿叧鐜鍙橀噺         PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}         WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}         APPRISE_URL: ${{ secrets.APPRISE_URL }}         BARK_SERVER: ${{ secrets.BARK_SERVER }}         BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}         BARK_SOUND: ${{ secrets.BARK_SOUND }}         NTFY_SERVER: ${{ secrets.NTFY_SERVER }}         NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}         NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}         FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}         FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}         WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}         WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}         DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}         DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}         GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}         GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}         GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}         GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}         # 浠ｇ悊璁剧疆锛堝彲閫夛級         HTTP_PROXY: ${{ secrets.HTTP_PROXY }}         HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}         SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}         SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}         SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}         SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}         PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}         PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}         NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || github.event.inputs.notify_only_on_failure == 'true' || 'false' }}         HISTORY_ENABLED: ${{ secrets.HISTORY_ENABLED || github.event.inputs.history_enabled == 'true' || 'true' }}         HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}         HISTORY_MAX_ENTRIES: ${{ secrets.HISTORY_MAX_ENTRIES || github.event.inputs.history_max_entries || '50' }}         HISTORY_PERSIST_RUNTIME_ERROR: ${{ secrets.HISTORY_PERSIST_RUNTIME_ERROR || 'true' }}         # 鍏朵粬鐜鍙橀噺         TZ: 'Asia/Shanghai'       run: |         echo "寮€濮嬭嚜鍔ㄩ槄璇讳换鍔?.."         echo "褰撳墠鏃堕棿: $(date)"         echo "杩愯鍙傛暟:"         echo "- 闃呰鏃堕暱: ${TARGET_DURATION}"         echo "- 闃呰妯″紡: ${{ github.event.inputs.reading_mode || 'smart_random' }}"         echo "- 鍚敤閫氱煡: ${{ github.event.inputs.notify_enabled != 'false' }}"         echo "- 浠呭け璐ラ€氱煡: ${{ github.event.inputs.notify_only_on_failure == 'true' }}"         echo "- 鍘嗗彶鎸佷箙鍖? ${{ github.event.inputs.history_enabled != 'false' }}"         echo "- 鍘嗗彶淇濈暀鏉℃暟: ${{ github.event.inputs.history_max_entries || '50' }}"         echo "================================"                  # 杩愯闃呰鏈哄櫒浜?         python weread-bot.py --config config.yaml      - name: Notify by email on failure       if: failure()       env:         MAIL_CONFIG: ${{ secrets.MAIL_CONFIG }}       run: |         {           echo "寰俊璇讳功鑷姩闃呰浠诲姟澶辫触銆?           echo ""           echo "浠撳簱: ${{ github.repository }}"           echo "杩愯璁板綍: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"           echo "浠诲姟鐘舵€? ${{ job.status }}"           echo ""           echo "鏈€甯歌鍘熷洜鏄櫥褰曞嚟鎹繃鏈燂紝璇烽噸鏂版姄鍙?curl 骞舵洿鏂?WEREAD_CURL_STRING銆?         } | python .github/scripts/send_mail.py "寰俊璇讳功鑷姩闃呰澶辫触" -      - name: Upload runtime artifacts       if: always()       uses: actions/upload-artifact@v4       with:         name: weread-runtime-${{ github.run_id }}         path: |           logs/weread.log           logs/run-history.json         if-no-files-found: warn         retention-days: 7